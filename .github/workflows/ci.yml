name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FloatKeys.sln --locked-mode
      - name: Build Release
        run: dotnet build FloatKeys.sln -c Release --no-restore
      - name: Test
        run: dotnet test FloatKeys.sln -c Release --no-build --logger trx
      - name: Package both architectures
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: FloatKeys-portable
          path: |
            artifacts/release/FloatKeys-*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
