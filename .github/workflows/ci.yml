name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source version
        shell: pwsh
        run: ./scripts/verify-version.ps1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FloatKeys.sln --locked-mode
      - name: Build Release
        run: dotnet build FloatKeys.sln -c Release --no-restore
      - name: Test
        run: dotnet test FloatKeys.sln -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Package both architectures
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FloatKeys-portable
          path: |
            artifacts/release/FloatKeys-*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
