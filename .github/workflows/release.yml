name: Tagged release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate tag and source version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') { throw 'Expected vMAJOR.MINOR.PATCH tag.' }
          $version = $Matches[1]
          [xml]$project = Get-Content src/FloatKeys/FloatKeys.csproj -Raw
          if ($project.Project.PropertyGroup.Version -ne $version) { throw 'Tag and source version differ.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FloatKeys.sln --locked-mode
      - name: Build Release
        run: dotnet build FloatKeys.sln -c Release --no-restore
      - name: Test
        run: dotnet test FloatKeys.sln -c Release --no-build --logger trx
      - name: Package both architectures
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            artifacts/release/FloatKeys-*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: artifacts/release
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./scripts/verify-packages.ps1 -Directory artifacts/release -Version $env:RELEASE_VERSION
          $assets = @("artifacts/release/FloatKeys-$env:RELEASE_TAG-win-arm64.zip", "artifacts/release/FloatKeys-$env:RELEASE_TAG-win-x64.zip", 'artifacts/release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "FloatKeys $env:RELEASE_TAG" --notes-file docs/release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed; any draft remains unpublished.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
