name: Tagged release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate tag and source version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ./scripts/verify-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore FloatKeys.sln --locked-mode
      - name: Build Release
        run: dotnet build FloatKeys.sln -c Release --no-restore
      - name: Test
        run: dotnet test FloatKeys.sln -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Package both architectures
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/package.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: |
            artifacts/release/FloatKeys-*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: artifacts/release
      - name: Verify and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./scripts/verify-packages.ps1 -Directory artifacts/release -Version $env:RELEASE_VERSION
          $assets = @("artifacts/release/FloatKeys-$env:RELEASE_TAG-win-arm64.zip", "artifacts/release/FloatKeys-$env:RELEASE_TAG-win-x64.zip", 'artifacts/release/SHA256SUMS.txt')
          gh release create $env:RELEASE_TAG --verify-tag --draft --title "FloatKeys $env:RELEASE_TAG" --notes-file docs/release-notes.md @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed; any draft remains unpublished.' }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
